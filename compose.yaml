---

services:
  calories-app:
    container_name: calories-app
    image: node:22.14-bookworm-slim
    user: ${UID:-1000}:${GID:-1000}
    ports: 
      - "5173:5173"
    entrypoint: sh -c "npm i --no-update-notifier && npm run dev"
    env_file:
      - ".env"
    volumes: 
      - ".:/app"
    working_dir: /app
    healthcheck:
      test: timeout 10s bash -c 'true > /dev/tcp/127.0.0.1/5173'
      interval: 1m30s
      timeout: 15s
      retries: 3
      start_period: 10s

  calories-ngrok:
    container_name: calories-ngrok
    image: ngrok/ngrok:3-alpine
    restart: unless-stopped
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:?NGROK_AUTHTOKEN must be set}
    command:
      - http
      - --url=https://flattop-depth-dropper.ngrok-free.dev
      - calories-app:5173
    ports:
      - "4040:4040"
    depends_on:
      calories-app:
        condition: service_healthy
